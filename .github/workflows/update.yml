name: Update TVBox subscriptions and publish Pages

"on":
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tvbox-update
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build subscriptions
        run: python scripts/update.py

      - name: Commit updated output
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No subscription changes"
          else
            git commit -m "chore: update TVBox subscriptions"
            git push origin main
          fi

      - name: Prepare GitHub Pages artifact
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
